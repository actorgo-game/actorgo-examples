<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ActorGo Chat Demo</title>
</head>
<body>
<div id="container">
    <div id="status">正在连接...</div>
    <div class="controls">
        <input type="text" id="nickname" readonly>
        <input type="text" id="balance" readonly>
        <input type="text" id="inputMsg" value="Hello~">
        <input type="button" id="sendMsg" value="Send" disabled>
        <input type="button" id="clean" value="Clean">
    </div>
    <ul id="msg-list"></ul>
</div>
<script src="jquery-3.6.1.min.js" type="text/javascript"></script>
<script src="agp-client.js" type="text/javascript"></script>
<script>
    const METHOD_LOGIN = 1001;
    const METHOD_SYNC_MESSAGE = 1002;
    const METHOD_NEW_USER = 1101;
    const METHOD_MESSAGE = 1102;
    const METHOD_BALANCE = 1103;

    let chatClient;

    $(document).ready(async function () {
        const nickname = "guest" + Date.now();
        $("#nickname").val(nickname);
        $("#balance").val(1000);

        $("#sendMsg").click(function () {
            try {
                const content = $("#inputMsg").val();
                chatClient.notify(METHOD_SYNC_MESSAGE, {
                    name: nickname,
                    content: content,
                    packetTime: Date.now() * 1000000
                });
            } catch (error) {
                showError(error);
            }
        });
        $("#clean").click(function () { $("#msg-list").empty(); });

        try {
            chatClient = new ActorGoAGPJSONClient();
            chatClient.onNotify = handleNotify;
            await chatClient.connect(window.location.hostname || "127.0.0.1", 34590);
            const response = await chatClient.request(METHOD_LOGIN, {nickname: nickname});
            if (response.code !== 0) throw new Error("聊天室登录失败，code=" + response.code);
            $("#status").text("已连接（AGP/1）");
            $("#sendMsg").prop("disabled", false);
        } catch (error) {
            showError(error);
        }
    });

    function handleNotify(methodID, data) {
        if (methodID === METHOD_NEW_USER) {
            pushMsg({name: "system", content: data.content});
        } else if (methodID === METHOD_MESSAGE) {
            pushMsg(data);
        } else if (methodID === METHOD_BALANCE) {
            $("#balance").val(data.currentBalance);
        }
    }

    function pushMsg(message) {
        const item = $("<li>");
        item.append($("<span>").css("color", "red").text("[" + message.name + "]"));
        item.append(document.createTextNode(message.content));
        $("#msg-list").append(item);
    }

    function showError(error) {
        console.error(error);
        $("#status").text(error && error.message ? error.message : String(error));
        $("#sendMsg").prop("disabled", true);
    }
</script>
</body>
</html>
